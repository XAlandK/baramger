[project]
name = "baramger-pipeline"
version = "0.1.0"
description = "Builds the offline Baramger mission package for a walk zone (Z1 Three Forks, Z2 Bright Angel) from the challenge resources."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "rasterio>=1.4",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "pyproj>=3.7",
  "pillow>=11.0",
  "jsonschema>=4.23",
  "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
baramger-build = "baramger_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baramger_pipeline"]

[tool.uv]
# Supply-chain caution: only resolve packages published at least two weeks before work started.
exclude-newer = "2026-10-31T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
