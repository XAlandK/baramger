<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baroler · Plan</title>
    <meta name="description" content="Plan a safe Marswalk in Jezero crater, Mars." />
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="3D map of the walk area"></div>
      <div id="map-title" class="map-chip">
        <span class="eyebrow">Baroler · Plan</span>
        <strong id="site-name">Loading…</strong>
        <select id="zone-select" aria-label="Walk zone" hidden></select>
      </div>
      <div id="add-hint" class="map-chip hint" hidden>Click the map to place the new stop. <button id="add-cancel" type="button">Cancel</button></div>
      <div id="readout" class="map-chip readout" aria-live="off"></div>
      <div id="compare-handle" hidden><span>Photo</span><span>Layers</span></div>
      <aside id="panel" aria-label="Walk plan"></aside>
      <div id="hud" aria-label="Helmet display" hidden></div>
      <div id="lightbox" hidden></div>
      <div id="modal" hidden></div>
      <div id="chart-tip" role="status" hidden></div>
      <div id="loading"><div class="spinner"></div><p id="loading-text">Loading the mission package…</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
